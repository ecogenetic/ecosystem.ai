  <text x="480" y="610" font-size="12" fill="#62625E">• Internal DNS: ecosystem-server:3001, ecosystem-server:54445 (MongoDB 9.0), workbench2:8001/8004, ecosystem-runtime-solo:8091, trino:8080</text>
  <text x="480" y="628" font-size="12" fill="#62625E">• PodAffinity co-locates shared-data PVC workloads with ecosystem-server on standard-rwo</text>

  <rect x="440" y="680" width="890" height="105" rx="8" fill="#E0F4FA" stroke="#003B5C" stroke-width="1.5"/>
  <text x="460" y="708" font-size="14" font-weight="bold" fill="#003B5C">Compute Engine Persistent Disk / Filestore (StorageClass: standard-rwo, 250 GiB PVC: shared-data)</text>
  <text x="460" y="730" font-size="12" fill="#151515">• Subpaths: /database (MongoDB data files), /data (H2O models, runtime plugins, notebooks), /modeling, /config, /var/log/supervisor, /app/backend/reports</text>
  <text x="460" y="750" font-size="12" fill="#62625E">• Customer owns all persistent volumes and encryption keys inside their GCP project</text>

