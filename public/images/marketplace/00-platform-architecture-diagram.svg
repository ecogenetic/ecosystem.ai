  <text x="60" y="170" font-size="13" font-weight="bold" fill="#151515">GCP Project: ecogenetic-public</text>
  <rect x="60" y="190" width="280" height="95" rx="6" fill="#E0F4FA" stroke="#00A1E0"/>
  <text x="75" y="215" font-size="13" font-weight="bold" fill="#003B5C">Artifact / Container Registry</text>
  <text x="75" y="236" font-size="12" fill="#151515">marketplace.gcr.io/ecogenetic/</text>
  <text x="75" y="254" font-size="12" fill="#151515">ecosystemai-platform-2:2.0.5</text>
  <text x="75" y="272" font-size="11" fill="#62625E">• Helm Deployer + 9 ARM64 Images</text>
  <rect x="60" y="300" width="280" height="95" rx="6" fill="#F0F1ED" stroke="#CFCFC7"/>
  <text x="75" y="325" font-size="13" font-weight="bold" fill="#151515">No Partner-Hosted Runtime SaaS</text>
