  <text x="695" y="378" font-size="11" fill="#151515">• React Operator SPA (:5270)</text>
  <text x="695" y="395" font-size="11" fill="#151515">• FastAPI Backend (:8001)</text>
  <text x="695" y="412" font-size="11" fill="#151515">• Public API (:8004)</text>

  <rect x="900" y="335" width="205" height="95" rx="6" fill="#FFFFFF" stroke="#00A1E0" stroke-width="2"/>
