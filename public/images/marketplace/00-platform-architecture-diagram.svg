  <text x="475" y="378" font-size="11" fill="#151515">• Spring API (:3001)</text>
  <text x="475" y="395" font-size="11" fill="#151515">• Embedded MongoDB (:54445)</text>
  <text x="475" y="412" font-size="11" fill="#151515">• H2O AutoML (:54321)</text>

