  <text x="85" y="618" font-size="12" fill="#003B5C">POST /mcp</text>

  <rect x="60" y="655" width="280" height="130" rx="6" fill="#F0F1ED" stroke="#CFCFC7"/>
  <text x="75" y="680" font-size="13" font-weight="bold" fill="#151515">Optional Outbound LLM Endpoint</text>
  <text x="75" y="702" font-size="12" fill="#62625E">• Customer-configured API key</text>
  <text x="75" y="722" font-size="12" fill="#62625E">• OpenAI (default gpt-6-luna), Vertex AI,</text>
  <text x="85" y="740" font-size="12" fill="#62625E">Anthropic, or self-hosted Ollama</text>
  <text x="75" y="762" font-size="11" fill="#777771">HTTPS Egress (443) from GKE only</text>

  <rect x="410" y="100" width="950" height="710" rx="12" fill="#FFFFFF" stroke="#00A1E0" stroke-width="3"/>
  <rect x="410" y="100" width="950" height="46" rx="12" fill="#003B5C"/>
  <text x="435" y="129" font-size="16" font-weight="bold" fill="#FFFFFF">Customer Google Cloud Project &amp; VPC (Customer-Hosted GKE Deployment)</text>

  <rect x="440" y="170" width="890" height="80" rx="8" fill="#E0F4FA" stroke="#00A1E0" stroke-width="1.5"/>
  <text x="460" y="198" font-size="14" font-weight="bold" fill="#003B5C">Google Cloud Load Balancing (GKE Ingress class: gce)</text>
  <text x="460" y="220" font-size="12" fill="#151515">• Google-Managed SSL Certificate (networking.gke.io/v1 ManagedCertificate) + FrontendConfig (HTTP -&gt; HTTPS 301)</text>
  <text x="460" y="238" font-size="12" fill="#62625E">• Routes: / (Workbench 2), /api (ecosystem-server), /invocations &amp; /response &amp; /mcp (Runtime), /campaign, /data-agents, /notebooks, /custom-gpts, /domain-catalog</text>

  <rect x="440" y="270" width="890" height="390" rx="10" fill="#F7F7F4" stroke="#003B5C" stroke-width="2"/>
  <text x="460" y="298" font-size="15" font-weight="bold" fill="#003B5C">Google Kubernetes Engine (GKE) Cluster — ARM64 Node Pool (c4a-standard-4, 4 vCPU, 16 GB)</text>
  <text x="460" y="318" font-size="12" fill="#62625E">Kubernetes Application CR (app.k8s.io/v1beta1) — Release: ecosystem-platform v2.0.5</text>

