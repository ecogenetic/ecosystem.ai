  <text x="915" y="378" font-size="11" fill="#151515">• Real-Time Scorer (:8091)</text>
  <text x="915" y="395" font-size="11" fill="#151515">• POST /invocations</text>
  <text x="915" y="412" font-size="11" fill="#151515">• POST /response &amp; /mcp</text>

