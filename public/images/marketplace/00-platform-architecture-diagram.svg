  <text x="60" y="477" font-size="15" font-weight="bold" fill="#FFFFFF">External / Non-GCP Services</text>
  <rect x="60" y="515" width="280" height="120" rx="6" fill="#F0F1ED" stroke="#CFCFC7"/>
  <text x="75" y="540" font-size="13" font-weight="bold" fill="#151515">Enterprise Users &amp; Client Apps</text>
  <text x="75" y="562" font-size="12" fill="#62625E">• Operator Browser (HTTPS :443)</text>
  <text x="75" y="582" font-size="12" fill="#62625E">• Real-Time Scoring Clients:</text>
